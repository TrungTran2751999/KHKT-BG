<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KHTN 8 – Chất và sự biến đổi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f8f6;--card:#fff;--tx:#17302a;--mu:#5d7770;--pr:#0f8a6c;--prt:#fff;--bd:#d7e4df;--no:#dc2626;--soft:#e4f3ee}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1815;--card:#16241f;--tx:#e6f1ed;--mu:#97b2aa;--pr:#2cc29b;--prt:#06231b;--bd:#27403a;--soft:#1b332c}}
:root[data-theme="dark"]{--bg:#0e1815;--card:#16241f;--tx:#e6f1ed;--mu:#97b2aa;--pr:#2cc29b;--prt:#06231b;--bd:#27403a;--soft:#1b332c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;color:var(--pr)}.sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:8px}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button.d{color:var(--no)}button.on{background:var(--soft);border-color:var(--pr);color:var(--pr);font-weight:600}
input,textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:3px 0 10px}
textarea{min-height:90px}label{font-size:13px;color:var(--mu);font-weight:600}
.nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.mu{color:var(--mu);font-size:13px}.stat{font-size:28px;font-weight:700;color:var(--pr)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.th h4{margin:18px 0 6px;color:var(--pr)}.th p,.th ul{margin:6px 0}.th li{margin:3px 0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--pr);font-size:12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd)}.step input{width:auto;margin:5px 0}
.box{background:var(--soft);border-radius:10px;padding:12px;margin-top:10px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:12px;background:var(--soft);border-radius:10px}.fb{background:var(--card);border:1px solid var(--pr);border-radius:8px;padding:6px 10px;text-align:center;font-size:13px}.fa{color:var(--pr);font-weight:700;font-size:13px}
.ph{height:18px;border-radius:9px;background:linear-gradient(90deg,#e11d48,#f59e0b,#84cc16,#10b981,#3b82f6,#7c3aed)}.pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:8px}
.note{border-left:4px solid var(--pr);padding:8px 12px;background:var(--soft);margin:12px 0;border-radius:0 8px 8px 0}
</style>
</head>
<body>
<div id="app">
<header>
  <span class="brand">⚗️ KHTN 8 · Chất và sự biến đổi</span><span class="sp"></span>
  <template v-if="role"><span class="tag">{{ role==='teacher'?'Giáo viên':'HS: '+(me&&me.name) }}</span><button @click="logout">Đăng xuất</button></template>
</header>
<main>

<!-- ĐĂNG NHẬP -->
<div v-if="!role" class="grid">
  <div class="card"><h3>👩‍🏫 Giáo viên</h3><p class="mu">Soạn tóm tắt bài, quản lí thí nghiệm, theo dõi học sinh.</p>
    <label>Mật khẩu (mặc định: gv123)</label><input type="password" v-model="pw" @keyup.enter="loginT">
    <button class="p" @click="loginT">Vào trang giáo viên</button><p v-if="err" style="color:var(--no)">{{err}}</p></div>
  <div class="card"><h3>🧑‍🎓 Học sinh</h3><p class="mu">Xem tóm tắt lí thuyết, sơ đồ và thí nghiệm của từng bài.</p>
    <label>Chọn tên của em</label>
    <select v-model="pick"><option value="">-- chọn --</option><option v-for="s in db.students" :value="s.id">{{s.name}}</option></select>
    <button class="p" :disabled="!pick" @click="loginS(pick)">Vào học</button>
    <hr style="border:0;border-top:1px solid var(--bd);margin:14px 0">
    <label>Hoặc tạo tên mới</label><input v-model="newName" placeholder="Họ và tên" @keyup.enter="regS">
    <button @click="regS">Tạo &amp; vào học</button></div>
</div>

<!-- GIÁO VIÊN -->
<template v-else-if="role==='teacher'">
  <div class="nav"><button v-for="t in [['home','Tổng quan'],['lessons','Bài học'],['students','Học sinh']]" :class="{on:tv===t[0]}" @click="tv=t[0];edit=null">{{t[1]}}</button></div>

  <div v-if="tv==='home'">
    <div class="grid">
      <div class="card"><div class="mu">Số bài học (đang hiển thị)</div><div class="stat">{{vis.length}}/{{db.lessons.length}}</div></div>
      <div class="card"><div class="mu">Số học sinh</div><div class="stat">{{db.students.length}}</div></div>
      <div class="card"><div class="mu">Tiến độ trung bình</div><div class="stat">{{avgProg}}%</div></div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>Mức độ hoàn thành theo bài (%)</h3><bar-chart :items="chartL" :max="100"></bar-chart><div class="mu">Mỗi bài gồm 2 phần: đọc tóm tắt lí thuyết và làm thí nghiệm.</div></div>
      <div class="card"><h3>Tiến độ từng học sinh (%)</h3><div class="tbl"><bar-chart :items="chartS" :max="100"></bar-chart></div></div>
    </div>
  </div>

  <div v-if="tv==='lessons'&&!edit">
    <button class="p" @click="newLesson" style="margin-bottom:12px">+ Thêm bài học</button>
    <div class="card" v-for="(l,i) in db.lessons" :key="l.id"><div class="row"><div><span class="tag">Bài {{i+1}}</span> <b>{{l.title}}</b><div class="mu">Thí nghiệm: {{l.exp.name||'chưa có'}} · {{(l.exp.sim||[]).length}} mô phỏng</div></div><span class="sp"></span>
      <button @click="l.hidden=!l.hidden;save()">{{l.hidden?'👁 Hiện bài (đang ẩn)':'🙈 Ẩn bài'}}</button><button @click="edit=clone(l)">Sửa</button><button class="d" @click="delLesson(l)">Xoá</button></div></div>
  </div>

  <div v-if="tv==='lessons'&&edit" class="card">
    <h3>{{isNew?'Bài học mới':'Sửa bài học'}}</h3>
    <label>Tiêu đề</label><input v-model="edit.title">
    <label>Tóm tắt lí thuyết (cho phép HTML: &lt;h4&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;b&gt;)</label><textarea v-model="edit.theory" style="min-height:240px"></textarea>
    <h4>Thí nghiệm</h4>
    <label>Tên thí nghiệm</label><input v-model="edit.exp.name">
    <label>Dụng cụ, hoá chất</label><input v-model="edit.exp.mats">
    <label>Các bước (mỗi dòng một bước)</label><textarea v-model="edit.exp.steps"></textarea>
    <label>Hiện tượng &amp; giải thích</label><textarea v-model="edit.exp.result"></textarea>
    <div class="row"><button class="p" @click="saveLesson">Lưu</button><button @click="edit=null">Huỷ</button></div>
  </div>

  <div v-if="tv==='students'">
    <div class="card row"><input v-model="newName" placeholder="Thêm học sinh mới" style="flex:1;margin:0" @keyup.enter="addS"><button class="p" @click="addS">Thêm</button></div>
    <div class="card" v-if="detail"><div class="row"><h3 style="margin:0">Chi tiết: {{detail.name}}</h3><span class="sp"></span><button @click="detail=null">Đóng</button></div>
      <div class="tbl"><table><thead><tr><th>Bài</th><th>Đã đọc lí thuyết</th><th>Đã làm thí nghiệm</th><th>Hoàn thành</th></tr></thead>
      <tbody><tr v-for="l in db.lessons" :key="l.id"><td>{{l.title}}</td><td>{{(detail.p[l.id]||{}).read?'✅':'⬜'}}</td><td>{{(detail.p[l.id]||{}).exp?'✅':'⬜'}}</td><td>{{lp(detail,l)}}%</td></tr></tbody></table></div></div>
    <div class="card tbl"><table><thead><tr><th>Học sinh</th><th v-for="(l,i) in db.lessons" :title="l.title">Bài {{i+1}}</th><th>Tiến độ</th><th></th></tr></thead>
      <tbody><tr v-for="s in db.students" :key="s.id"><td><a href="#" @click.prevent="detail=s" style="color:var(--pr);font-weight:600">{{s.name}}</a></td>
        <td v-for="l in db.lessons">{{(s.p[l.id]||{}).read?'📖':'·'}} {{(s.p[l.id]||{}).exp?'🧪':'·'}}</td><td>{{prog(s)}}%</td><td><button class="d" @click="delS(s)">Xoá</button></td></tr></tbody></table>
      <p class="mu">📖 đã đọc lí thuyết · 🧪 đã làm thí nghiệm. Bấm tên học sinh để xem chi tiết.</p></div>
  </div>
</template>

<!-- HỌC SINH -->
<template v-else>
  <div v-if="!cur">
    <div class="card"><b>Xin chào {{me.name}}!</b>
      <div class="row" style="margin-top:8px"><donut :v="prog(me)"></donut><span class="mu">Tiến độ chung của em.<br>Mỗi bài: đọc tóm tắt lí thuyết + làm thí nghiệm.</span></div></div>
    <div class="grid"><div class="card" v-for="(l,i) in vis" :key="l.id"><span class="tag">Bài {{i+1}}</span><h3 style="margin:8px 0">{{l.title}}</h3>
      <div class="bar"><i :style="{width:lp(me,l)+'%'}"></i></div>
      <div class="mu" style="margin:6px 0 10px">{{(me.p[l.id]||{}).read?'✅':'⬜'}} Lí thuyết &nbsp; {{(me.p[l.id]||{}).exp?'✅':'⬜'}} Thí nghiệm</div>
      <button class="p" @click="open(l)">Xem bài</button></div></div>
    <div class="card" v-if="!vis.length">Chưa có bài học nào được mở.</div>
  </div>

  <div v-else>
    <button @click="cur=null" style="margin-bottom:12px">← Danh sách bài</button>
    <div class="card"><h2 style="margin:0 0 10px">{{cur.title}}</h2>
      <div class="nav" style="margin:0"><button v-for="t in [['th','📖 Tóm tắt lí thuyết'],['tn','🧪 Thí nghiệm']]" :class="{on:tab===t[0]}" @click="tab=t[0]">{{t[1]}}</button></div></div>

    <div class="card" v-if="tab==='th'"><div class="th" v-html="cur.theory"></div>
      <div class="row" style="margin-top:14px"><label class="row" style="font-size:15px;color:var(--tx)"><input type="checkbox" style="width:auto;margin:0" :checked="pr(me,cur).read" @change="pr(me,cur).read=$event.target.checked;save()"> Em đã đọc xong bài này</label></div></div>

    <div class="card" v-if="tab==='tn'"><h3 style="margin-top:0">{{cur.exp.name||'Chưa có thí nghiệm'}}</h3>
      <div class="box"><b>Dụng cụ, hoá chất:</b> {{cur.exp.mats}}</div>
      <div class="step" v-for="(s,i) in steps(cur)" :key="i"><input type="checkbox" v-model="chk[i]"><span :style="{textDecoration:chk[i]?'line-through':'none'}"><b>Bước {{i+1}}.</b> {{s}}</span></div>
      <div class="row" style="margin-top:12px"><button class="p" :disabled="!allChk" @click="showRes=true;pr(me,cur).exp=true;save()">Quan sát hiện tượng</button><span class="mu" v-if="!allChk">Tích đủ các bước để xem kết quả.</span></div>
      <div class="box" v-if="showRes||pr(me,cur).exp"><b>Hiện tượng &amp; giải thích:</b><p>{{cur.exp.result}}</p></div>
      <div v-if="cur.exp.sim&&cur.exp.sim.length" style="margin-top:16px"><h4 style="color:var(--pr);margin:0 0 8px">🔬 Mô phỏng: chọn thí nghiệm để quan sát</h4>
        <div class="row"><button v-for="(x,i) in cur.exp.sim" :key="i" :class="{on:sim===i}" @click="sim=i">{{x.n}}</button></div>
        <div class="box row" v-if="sim>=0"><svg viewBox="0 0 120 120" width="120"><path d="M32 45 V95 Q32 103 40 103 H80 Q88 103 88 95 V45 Z" :fill="cur.exp.sim[sim].c"/><path d="M30 15 V95 Q30 105 40 105 H80 Q90 105 90 95 V15" fill="none" stroke="var(--tx)" stroke-width="3"/>
          <g v-if="cur.exp.sim[sim].k==='gas'"><circle v-for="b in 6" :key="b" :cx="36+b*8" cy="90" r="3" fill="#fff" stroke="var(--mu)" stroke-width=".5"><animate attributeName="cy" values="95;50" :dur="(0.8+b*0.25)+'s'" repeatCount="indefinite"/></circle></g>
          <g v-if="cur.exp.sim[sim].k==='ppt'"><circle v-for="b in 7" :key="b" :cx="34+b*7" cy="98" r="3.5" fill="var(--tx)" opacity=".55"/></g></svg>
          <div style="flex:1;min-width:200px"><b>{{cur.exp.sim[sim].n}}</b><p style="margin:6px 0 0">{{cur.exp.sim[sim].r}}</p></div></div></div>
    </div>
  </div>
</template>
</main>
</div>

<script>
const {createApp,reactive,toRefs,computed}=Vue;
const KEY='khtn8_v4';
const flow=a=>'<div class="flow">'+a.map(x=>x[0]==='>'?'<span class="fa">'+x.slice(1)+'</span>':'<div class="fb">'+x+'</div>').join('')+'</div>';
const note=t=>'<div class="note"><b>Ghi nhớ:</b> '+t+'</div>';
const L=(id,title,theory,e,sim)=>({id,title,theory,exp:{name:e[0],mats:e[1],steps:e[2],result:e[3],sim}});
const seed=()=>({lessons:[
L(1,'Phản ứng hoá học',
'<h4>1. Biến đổi vật lí và biến đổi hoá học</h4><ul><li><b>Biến đổi vật lí:</b> chỉ thay đổi trạng thái, hình dạng, kích thước; không tạo chất mới (nước đá tan, hoà tan muối).</li><li><b>Biến đổi hoá học (phản ứng hoá học):</b> chất này biến đổi thành chất khác (đốt cháy cồn, sắt bị gỉ).</li></ul>'+
'<h4>2. Phản ứng hoá học</h4><p>Chất ban đầu là <b>chất phản ứng (chất tham gia)</b>, chất mới tạo thành là <b>sản phẩm</b>. Liên kết giữa các nguyên tử bị phá vỡ rồi hình thành liên kết mới, còn <b>số nguyên tử mỗi nguyên tố không đổi</b>.</p>'+flow(['Chất phản ứng','>→ biến đổi →','Sản phẩm (chất mới)'])+
'<h4>3. Dấu hiệu nhận biết</h4><ul><li>Đổi màu sắc; có chất khí thoát ra (sủi bọt); xuất hiện kết tủa.</li><li>Toả nhiệt, phát sáng hoặc thu nhiệt.</li></ul>'+
'<h4>4. Năng lượng của phản ứng</h4><ul><li><b>Toả nhiệt:</b> nhiệt độ tăng (đốt than, trung hoà acid – base).</li><li><b>Thu nhiệt:</b> nhiệt độ giảm, cần cấp năng lượng (nung đá vôi).</li></ul>'+
note('Phân biệt biến đổi hoá học và vật lí dựa vào việc có chất mới tạo thành hay không.'),
['Sắt tác dụng với dung dịch đồng(II) sunfat','Đinh sắt đã đánh sạch, dung dịch CuSO₄, cốc thuỷ tinh','Rót dung dịch CuSO₄ vào cốc\nThả đinh sắt vào dung dịch\nĐể yên 5 phút rồi quan sát màu đinh sắt và màu dung dịch','Đinh sắt phủ lớp chất rắn màu đỏ (đồng), màu xanh của dung dịch nhạt dần: có chất mới tạo thành. Fe + CuSO₄ → FeSO₄ + Cu.'],
[{n:'Fe + dd CuSO₄',c:'#9ec9e8',r:'Đinh sắt phủ đồng màu đỏ, dung dịch nhạt dần màu xanh: có chất mới.',k:'ppt'},{n:'Zn + dd HCl',c:'#e8f1f5',r:'Có bọt khí H₂ thoát ra, kẽm tan dần.',k:'gas'},{n:'Đun nóng nước đá',c:'#e8f1f5',r:'Chỉ đổi trạng thái, không tạo chất mới: biến đổi vật lí.',k:''}]),
L(2,'Định luật bảo toàn khối lượng và phương trình hoá học',
'<h4>1. Định luật bảo toàn khối lượng (Lavoisier)</h4><p>Trong một phản ứng hoá học, <b>tổng khối lượng các chất sản phẩm bằng tổng khối lượng các chất phản ứng</b>.</p><p>A + B → C + D thì m<sub>A</sub> + m<sub>B</sub> = m<sub>C</sub> + m<sub>D</sub>.</p>'+
'<h4>2. Phương trình hoá học (PTHH)</h4><p>PTHH biểu diễn ngắn gọn phản ứng bằng công thức hoá học.</p>'+flow(['B1: Viết sơ đồ phản ứng','>→','B2: Cân bằng nguyên tử mỗi nguyên tố','>→','B3: Viết PTHH'])+
'<p>Ví dụ: <b>4Al + 3O₂ → 2Al₂O₃</b> (tỉ lệ 4 : 3 : 2). Hệ số cho biết tỉ lệ số nguyên tử, phân tử (hoặc số mol) giữa các chất.</p>'+
note('Số nguyên tử của mỗi nguyên tố ở hai vế phải bằng nhau; không được đổi chỉ số trong công thức khi cân bằng.'),
['Kiểm chứng bảo toàn khối lượng','Cân, 2 ống nghiệm, dd BaCl₂, dd Na₂SO₄, giá ống nghiệm','Cho hai dung dịch vào hai ống riêng\nCân khối lượng cả hai ống\nĐổ ống này vào ống kia, cân lại','Xuất hiện kết tủa trắng BaSO₄ nhưng số chỉ cân không đổi: khối lượng được bảo toàn. BaCl₂ + Na₂SO₄ → BaSO₄↓ + 2NaCl.'],
[{n:'BaCl₂ + Na₂SO₄',c:'#f1f1f1',r:'Kết tủa trắng BaSO₄; cân trước và sau phản ứng không đổi.',k:'ppt'},{n:'CaCO₃ + HCl (cốc hở)',c:'#e8f1f5',r:'CO₂ bay ra ngoài nên số chỉ cân giảm; trong bình kín thì khối lượng không đổi.',k:'gas'},{n:'Đốt Mg trong không khí',c:'#fff4c2',r:'Cháy sáng chói tạo MgO màu trắng; khối lượng tăng vì Mg kết hợp thêm O₂.',k:''}]),
L(3,'Mol, tỉ khối chất khí và tính theo PTHH',
'<h4>1. Mol</h4><p>1 mol chứa 6,022·10²³ hạt (nguyên tử, phân tử). Khối lượng mol M (g/mol) có số trị bằng nguyên tử khối hoặc phân tử khối.</p>'+
'<h4>2. Công thức chuyển đổi</h4>'+flow(['m (g)','>⇄ ÷M / ×M ⇄','n (mol)','>⇄ ×24,79 / ÷24,79 ⇄','V (L, đkc)'])+'<p>Ở điều kiện chuẩn (25 °C, 1 bar), 1 mol chất khí chiếm thể tích 24,79 L.</p>'+
'<h4>3. Tỉ khối chất khí</h4><ul><li>d<sub>A/B</sub> = M<sub>A</sub> / M<sub>B</sub>: khí A nặng gấp d lần khí B.</li><li>d<sub>A/kk</sub> = M<sub>A</sub> / 29.</li></ul>'+
'<h4>4. Tính theo PTHH</h4><ul><li>Đổi dữ kiện về số mol.</li><li>Lập tỉ lệ mol theo hệ số của PTHH.</li><li>Tính khối lượng hoặc thể tích cần tìm.</li></ul><p>Hiệu suất: H = lượng thực tế / lượng lí thuyết × 100%.</p>'+
note('Số mol là "cầu nối" giữa khối lượng, thể tích khí và số hạt.'),
['Khí CO₂ thổi phồng bóng bay','Chai nhựa, giấm ăn, baking soda, bóng bay, thìa','Cho 2 thìa baking soda vào bóng bay\nRót khoảng 50 mL giấm vào chai\nChụp miệng bóng lên miệng chai rồi dốc baking soda xuống\nQuan sát bóng bay','Có sủi bọt, bóng phồng lên vì sinh ra khí CO₂: NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑. CO₂ nặng hơn không khí (d ≈ 44/29 ≈ 1,52).'],
[{n:'Baking soda + giấm',c:'#e8f1f5',r:'Khí CO₂ thoát ra làm phồng bóng bay (d CO₂/kk ≈ 1,52).',k:'gas'},{n:'Zn + HCl',c:'#e8f1f5',r:'Sinh khí H₂ nhẹ hơn không khí (d = 2/29 ≈ 0,07).',k:'gas'}]),
L(4,'Dung dịch và nồng độ dung dịch',
'<h4>1. Dung dịch</h4><p>Hỗn hợp đồng nhất của <b>chất tan</b> và <b>dung môi</b> (thường là nước). Dung dịch bão hoà là dung dịch không hoà tan thêm chất tan ở nhiệt độ đó.</p>'+flow(['Chất tan','>+','Dung môi','>=','Dung dịch'])+
'<h4>2. Độ tan</h4><p>Độ tan (S) là số gam chất tan trong 100 g nước tạo thành dung dịch bão hoà ở nhiệt độ xác định. Đa số chất rắn tan nhiều hơn khi nhiệt độ tăng; chất khí tan nhiều hơn khi nhiệt độ giảm và áp suất tăng.</p>'+
'<h4>3. Nồng độ dung dịch</h4><ul><li>Nồng độ phần trăm: C% = m<sub>ct</sub> / m<sub>dd</sub> × 100%</li><li>Nồng độ mol: C<sub>M</sub> = n / V (mol/L)</li></ul>'+
note('m<sub>dd</sub> = m<sub>chất tan</sub> + m<sub>dung môi</sub>. Đổi thể tích về lít khi tính C<sub>M</sub>.'),
['Pha dung dịch muối ăn 10%','Muối ăn, nước, cân, cốc, đũa khuấy','Cân 10 g muối ăn\nĐong 90 g nước vào cốc\nĐổ muối vào cốc, khuấy đến khi tan hết','Muối tan hoàn toàn tạo dung dịch trong suốt, C% = 10/(10+90) × 100% = 10%.'],
[{n:'10 g muối + 90 g nước',c:'#e8f1f5',r:'Muối tan hết, thu dung dịch có C% = 10%.',k:''},{n:'Thêm muối đến bão hoà',c:'#e8f1f5',r:'Muối dư lắng dưới đáy: dung dịch đã bão hoà.',k:'ppt'},{n:'CuSO₄ tan trong nước',c:'#7ab8e8',r:'Dung dịch màu xanh lam, nồng độ càng lớn màu càng đậm.',k:''}]),
L(5,'Acid – Base – Thang pH',
'<h4>1. Acid</h4><p>Có vị chua, làm quỳ tím hoá <b>đỏ</b> (HCl, H₂SO₄, CH₃COOH). Tác dụng với kim loại hoạt động → muối + H₂; với base → muối + nước; với carbonate → muối + CO₂ + H₂O.</p>'+
'<h4>2. Base (kiềm)</h4><p>Làm quỳ tím hoá <b>xanh</b> (NaOH, Ca(OH)₂); tác dụng với acid (phản ứng trung hoà).</p>'+
'<h4>3. Thang pH</h4><div class="ph"></div><div class="pl"><span>0 – acid mạnh</span><span>7 – trung tính</span><span>14 – base mạnh</span></div><ul><li>pH &lt; 7: acid; pH = 7: trung tính; pH &gt; 7: base.</li><li>pH càng nhỏ acid càng mạnh; pH càng lớn base càng mạnh.</li></ul>'+flow(['Acid','>+','Base','>→','Muối + H₂O'])+
note('Nhận biết bằng quỳ tím, giấy pH hoặc nước ép bắp cải tím.'),
['Chất chỉ thị từ bắp cải tím','Nước ép bắp cải tím, giấm, nước chanh, dung dịch xà phòng, 3 cốc','Rót nước bắp cải tím vào 3 cốc\nNhỏ giấm, nước chanh, dung dịch xà phòng vào từng cốc\nQuan sát màu của mỗi cốc','Giấm và nước chanh làm dung dịch chuyển hồng/đỏ (acid); xà phòng làm dung dịch chuyển xanh lục (base).'],
[{n:'Nước chanh (pH≈2)',c:'#e11d48',r:'Nước bắp cải chuyển đỏ: acid mạnh.',k:''},{n:'Giấm ăn (pH≈3)',c:'#ec4899',r:'Chuyển hồng: acid.',k:''},{n:'Nước cất (pH=7)',c:'#7c3aed',r:'Giữ màu tím: trung tính.',k:''},{n:'Xà phòng (pH≈10)',c:'#22c55e',r:'Chuyển xanh lục: base yếu.',k:''},{n:'NaOH loãng (pH≈13)',c:'#eab308',r:'Chuyển vàng: base mạnh.',k:''}]),
L(6,'Tốc độ phản ứng và chất xúc tác',
'<h4>1. Tốc độ phản ứng</h4><p>Cho biết phản ứng xảy ra nhanh hay chậm, tính bằng sự thay đổi lượng chất trong một đơn vị thời gian.</p>'+
'<h4>2. Các yếu tố ảnh hưởng</h4><ul><li><b>Nồng độ</b> chất phản ứng tăng → phản ứng nhanh hơn.</li><li><b>Nhiệt độ</b> tăng → phản ứng nhanh hơn.</li><li><b>Diện tích tiếp xúc</b> tăng (nghiền nhỏ chất rắn) → nhanh hơn.</li><li><b>Chất xúc tác</b> làm tăng tốc độ phản ứng nhưng không bị tiêu hao.</li></ul>'+
flow(['Nồng độ ↑','>·','Nhiệt độ ↑','>·','Diện tích tiếp xúc ↑','>·','Chất xúc tác','>⇒','Phản ứng nhanh hơn'])+
note('Ứng dụng: bảo quản thực phẩm trong tủ lạnh làm chậm phản ứng ươn hỏng; men giúp quá trình lên men diễn ra nhanh hơn.'),
['Chất xúc tác làm phân huỷ oxi già','2 cốc, dung dịch H₂O₂ 3%, vài lát khoai tây sống','Rót lượng H₂O₂ như nhau vào 2 cốc\nCho lát khoai tây sống vào cốc 2, cốc 1 để đối chứng\nQuan sát lượng bọt khí ở hai cốc','Cốc có khoai tây sủi bọt khí O₂ mạnh hơn nhiều: men trong khoai tây là chất xúc tác làm tăng tốc độ phản ứng 2H₂O₂ → 2H₂O + O₂.'],
[{n:'H₂O₂ để yên (đối chứng)',c:'#e8f1f5',r:'Rất ít bọt khí: phản ứng phân huỷ diễn ra chậm.',k:''},{n:'H₂O₂ + khoai tây',c:'#e8f1f5',r:'Sủi bọt O₂ mạnh: xúc tác làm phản ứng nhanh hơn, khoai không bị tiêu hao.',k:'gas'},{n:'Viên sủi: nước nóng vs lạnh',c:'#e8f1f5',r:'Nước nóng: viên tan và sủi nhanh hơn do nhiệt độ cao hơn.',k:'gas'},{n:'Viên sủi: nguyên vs nghiền',c:'#e8f1f5',r:'Viên nghiền nhỏ có diện tích tiếp xúc lớn nên sủi nhanh hơn.',k:'gas'}])],
students:[{id:1,name:'Nguyễn Minh An',p:{}},{id:2,name:'Trần Bảo Châu',p:{}},{id:3,name:'Lê Gia Huy',p:{}}]});
let init;try{init=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!init||!init.lessons)init=seed();

const BarChart={props:{items:Array,max:{type:Number,default:100}},
template:`<svg :viewBox="'0 0 '+w+' 190'" width="100%" role="img"><g v-for="g in [0,.5,1]"><line x1="30" :x2="w" :y1="150-g*120" :y2="150-g*120" stroke="var(--bd)"/><text x="26" :y="154-g*120" text-anchor="end" font-size="10" fill="var(--mu)">{{+(g*max).toFixed(0)}}</text></g><g v-for="(it,i) in items" :key="i"><rect :x="40+i*bw" :y="150-h(it)" :width="bw-14" :height="h(it)" rx="4" fill="var(--pr)"/><text :x="40+i*bw+(bw-14)/2" :y="144-h(it)" text-anchor="middle" font-size="11" fill="var(--tx)">{{it.value}}</text><text :x="40+i*bw+(bw-14)/2" y="168" text-anchor="middle" font-size="10" fill="var(--mu)">{{it.label}}</text></g></svg>`,
computed:{bw(){return Math.max(54,Math.min(90,600/Math.max(this.items.length,1)))},w(){return 50+this.items.length*this.bw}},
methods:{h(it){return it.value?Math.min(it.value,this.max)/this.max*120:0}}};
const Donut={props:{v:Number},template:`<svg viewBox="0 0 100 100" width="110"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--pr)" stroke-width="12" stroke-linecap="round" :stroke-dasharray="v*2.513+' 251.3'" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tx)">{{v}}%</text></svg>`};

createApp({setup(){
  const db=reactive(init);
  const s=reactive({role:null,me:null,pw:'',err:'',pick:'',newName:'',tv:'home',edit:null,isNew:false,cur:null,tab:'th',chk:{},showRes:false,sim:-1,detail:null});
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
  const clone=l=>{const c=JSON.parse(JSON.stringify(l));c.exp.steps=String(c.exp.steps);s.isNew=false;return c};
  const pr=(st,l)=>{if(!st.p[l.id])st.p[l.id]={read:false,exp:false};return st.p[l.id]};
  const vis=computed(()=>db.lessons.filter(l=>!l.hidden));
  const lp=(st,l)=>{const p=st.p[l.id]||{};return((p.read?1:0)+(p.exp?1:0))*50};
  const prog=st=>vis.value.length?Math.round(vis.value.reduce((a,l)=>a+lp(st,l),0)/vis.value.length):0;
  const avgProg=computed(()=>db.students.length?Math.round(db.students.reduce((a,x)=>a+prog(x),0)/db.students.length):0);
  const chartL=computed(()=>db.lessons.map((l,i)=>({label:'Bài '+(i+1),value:db.students.length?Math.round(db.students.reduce((a,x)=>a+lp(x,l),0)/db.students.length):0})));
  const chartS=computed(()=>db.students.map(x=>({label:x.name.split(' ').pop(),value:prog(x)})));
  const steps=l=>String(l.exp.steps||'').split('\n').filter(x=>x.trim());
  const allChk=computed(()=>s.cur&&steps(s.cur).length>0&&steps(s.cur).every((_,i)=>s.chk[i]));
  const loginT=()=>{if(s.pw==='gv123'){s.role='teacher';s.err='';s.pw=''}else s.err='Sai mật khẩu.'};
  const loginS=id=>{s.me=db.students.find(x=>x.id==id);s.role='student';s.cur=null};
  const regS=()=>{const n=s.newName.trim();if(!n)return;const st={id:Date.now(),name:n,p:{}};db.students.push(st);save();s.newName='';loginS(st.id)};
  const addS=()=>{const n=s.newName.trim();if(!n)return;db.students.push({id:Date.now(),name:n,p:{}});s.newName='';save()};
  const delS=st=>{if(confirm('Xoá '+st.name+'?')){if(s.detail===st)s.detail=null;db.students.splice(db.students.indexOf(st),1);save()}};
  const logout=()=>{s.role=null;s.me=null;s.cur=null;s.edit=null;s.tv='home'};
  const newLesson=()=>{s.isNew=true;s.edit={id:Date.now(),title:'',theory:'',exp:{name:'',mats:'',steps:'',result:'',sim:[]}}};
  const saveLesson=()=>{const e=s.edit;if(!e.title.trim())return alert('Nhập tiêu đề bài học.');const i=db.lessons.findIndex(l=>l.id===e.id);if(i<0)db.lessons.push(e);else db.lessons[i]=e;save();s.edit=null};
  const delLesson=l=>{if(confirm('Xoá bài "'+l.title+'"?')){db.lessons.splice(db.lessons.indexOf(l),1);save()}};
  const open=l=>{pr(s.me,l);s.cur=l;s.tab='th';s.sim=-1;s.showRes=false;s.chk={}};
  return{db,...toRefs(s),vis,avgProg,chartL,chartS,save,clone,pr,lp,prog,steps,allChk,loginT,loginS,regS,addS,delS,logout,newLesson,saveLesson,delLesson,open}
}}).component('bar-chart',BarChart).component('donut',Donut).mount('#app');
</script>
</body>
</html>
